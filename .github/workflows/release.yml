name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb and publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gdkpixbuf-2.0

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(python3 - command_quiver/__init__.py <<'PY'
          import re
          import sys

          text = open(sys.argv[1], encoding="utf-8").read()
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )"
          echo "Package version: $PKG_VERSION  |  tag: ${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build .deb
        run: bash scripts/build-deb.sh

      - name: Publish GitHub Release with .deb asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
